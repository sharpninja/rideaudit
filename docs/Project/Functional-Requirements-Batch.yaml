    title: "Court-review decryption path docs"
    description: "Document and implement the court-review decryption path: identify private-key custodians, legal-process requirements for counsel to obtain plaintext, escrow jurisdiction and controls, dual-control release and attestations, authorized working-copy scope/expiry, and exactly what the chain-of-custody receipt proves (and does not prove)."
