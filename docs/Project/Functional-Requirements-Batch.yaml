    notes: "Original FR-20. Update 2026-09-29: RAES or RIDESEAL1 working-copy decrypt is only through the counsel and HSM escrow path. Public admission stays fail-closed and does not decrypt. approval: Payton AGREE 2026-09-29."
    acceptanceCriteria:
