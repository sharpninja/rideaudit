    title: "Escrow separation from device"
    description: "Keep escrow material separate from the collection device, operator account, and application database. Document per key whether the escrow package contains quorum-protected private-key shares or a wrapped DEK, while the device retains only the public key/key ID and transient or encrypted recovery material needed for collection; no plaintext private key may persist on-device after sealing."
    priority: critical
    area: RIDE
    status: pending
    notes: "Original FR-23."
