      - id: AC-RIDE-017-002
        text: "Blockchain transaction reference is recorded when confirmed."
        isSatisfied: false
  - kind: fr
    id: FR-RIDE-018
    title: "Blockchain receipt write"
    description: "Write each receipt synchronously with, or immediately after, sealing to a configurable public immutable blockchain within the same collection transaction boundary; record chain ID, transaction hash, block height, and write time when confirmed."
    priority: critical
    area: RIDE
    status: pending
    notes: "Original FR-18. Update 2026-09-29: a live OpenTimestamps public calendar submit may be pending only (PR #23). Confirmation and txid stay Class C until upgrade succeeds. approval: Payton AGREE 2026-09-29. Does not set live_bitcoin_metadata or admission."
    acceptanceCriteria:
      - id: AC-RIDE-018-001
        text: "Receipt write is synchronous with or immediately after sealing in the same collection boundary."
        isSatisfied: false
      - id: AC-RIDE-018-002
        text: "Chain ID, tx hash, block height, and write time are recorded on confirmation."
        isSatisfied: false
      - id: AC-RIDE-018-003
        text: "Chain brand is configurable, not hard-coded to one mainnet."
        isSatisfied: false
      - id: AC-RIDE-018-004
        text: "A live OpenTimestamps public calendar submit may be receipted as pending when the calendar returns HTTP success and a pending attestation. A documented fixture calendar is not this AC. A pending proof is not confirmation."
        isSatisfied: false
      - id: AC-RIDE-018-005
        text: "Bitcoin confirmation, transaction id, and block height stay unsatisfied (Class C) until a later upgrade succeeds. A pending calendar body is not stored as transaction_reference, does not set live_bitcoin_metadata, and does not admit the record."
        isSatisfied: false
  - kind: fr
    id: FR-RIDE-019
    title: "Blockchain write failure policy"
    description: "Apply an explicit failure policy: if the blockchain write or confirmation fails, do not mark collection complete, do not place the sealed record in an admitted state, and quarantine/retry the sealed record and pending receipt without rewriting the ciphertext; surface the failure for operator action and preserve the local failure audit trail."
    priority: critical
    area: RIDE
    status: pending
    notes: "Original FR-19."
    acceptanceCriteria:
      - id: AC-RIDE-019-001
        text: "Failed chain write leaves record non-admitted and not collection-complete."
        isSatisfied: false
      - id: AC-RIDE-019-002
        text: "Ciphertext is not rewritten on retry."
        isSatisfied: false
      - id: AC-RIDE-019-003
        text: "Operator sees failure and local audit trail is preserved."
        isSatisfied: false
