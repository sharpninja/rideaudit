    description: "Create a custody receipt for every sealed record containing, at minimum, the sealed-payload content hash, the public encryption key used (or key ID plus the public key material), collector identity, collection timestamp, provenance tag, and the blockchain transaction reference once confirmed."
    priority: critical
    area: RIDE
    status: pending
    notes: "Original FR-17."
    acceptanceCriteria:
      - id: AC-RIDE-017-001
        text: "Receipt includes content hash, public key or key ID plus material, collector identity, timestamp, provenance tag."
