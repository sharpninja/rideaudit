        text: "Documentation identifies custodians, legal process, escrow jurisdiction, dual-control, working-copy scope/expiry."
        isSatisfied: false
      - id: AC-RIDE-020-002
        text: "Receipt proof boundaries are explicit (what it proves and does not prove)."
        isSatisfied: false
      - id: AC-RIDE-020-003
        text: "Implementation matches documented path."
        isSatisfied: false
      - id: AC-RIDE-020-004
        text: "An RAES or RIDESEAL1 envelope is decrypted only as an expiring counsel working copy after HSM escrow release. Public admission does not decrypt."
        isSatisfied: false
