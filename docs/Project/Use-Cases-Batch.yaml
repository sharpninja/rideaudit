    title: "Ingest privacy-export ZIP"
    briefDescription: "Driver or auditor uploads a consented Lyft privacy-export ZIP; system parses DataDictionary files and tags unknowns Unverified."
    actors: [Driver, Auditor]
    frLinks:
      - frId: FR-RIDE-001
