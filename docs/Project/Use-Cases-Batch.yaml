      - frId: FR-RIDE-003
        linkType: Realizes
      - frId: FR-RIDE-006
        linkType: Realizes
      - frId: FR-RIDE-013
        linkType: Realizes
    basicFlow: |
      1. Actor authenticates and confirms consent/jurisdiction/purpose.
      2. Actor uploads privacy-export ZIP.
