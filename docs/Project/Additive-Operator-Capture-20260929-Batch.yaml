      4. Operator leaves commercial signing deferred. Publisher identity is the individual Payton Byrd using IV plus eSigner. An organization OV certificate is not the publisher identity. Do not buy a certificate yet. macOS codesign stays deferred.
      5. Operator does not treat the lab signature as AC-RIDE-222-001.
    acceptanceCriteria:
