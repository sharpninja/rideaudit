records:
  - kind: fr
    id: FR-RIDE-065
    title: Caddy edge TLS distinct from ngrok
    description: >
      RideAudit edge TLS is terminated by Caddy and is distinct from ngrok HTTPS.
      ngrok HTTPS remains FR-RIDE-064 and is not this requirement. Omarchy or
      LAB-OMARCHY loopback or LAN HTTP is not a Caddy TLS receipt. This item
      is Class C and may still be in flight.
    priority: high
    area: RIDE
    status: pending
    notes: >
      Operator capture 2026-09-29 from plan section 11. approval: Payton AGREE 2026-09-29.
      Does not treat the ngrok public URL as edge TLS.
    acceptanceCriteria:
      - id: AC-RIDE-065-001
        text: Caddy presents edge TLS for the documented RideAudit edge host.
        isSatisfied: false
      - id: AC-RIDE-065-002
        text: An ngrok HTTPS URL is not accepted as the Caddy edge TLS receipt.
        isSatisfied: false
      - id: AC-RIDE-065-003
        text: Loopback or LAN HTTP is not accepted as the Caddy edge TLS receipt. The item stays open while Class C.
        isSatisfied: false

