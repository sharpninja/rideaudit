        isSatisfied: false
      - id: AC-RIDE-073-003
        text: Each storyboard is navigated as its step sequence by interacting with the running Avalonia Android app through SharpNinja.Avalonia.RemoteControl (AvaloniaRemote). A screenshot is captured and compared at each storyboard frame. A static single-shot screenshot alone does not satisfy this AC.
        isSatisfied: false
