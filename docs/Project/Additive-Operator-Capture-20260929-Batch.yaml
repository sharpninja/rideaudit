  - kind: usecase
    localId: UC-RIDE-034
    title: Operator publishes a lab-signed Windows desktop build
    actors:
      - Operator
    briefDescription: >
      Operator signs a Windows lab desktop build with CN=RideAudit Lab Self-Signed
      and records that the result is not Public Trust. Commercial IV plus eSigner
      or OV plus cloud HSM, and macOS codesign, stay deferred. approval: pending Payton AGREE.
    basicFlow: |
      1. Operator publishes the framework-dependent win-x64 desktop build on PAYTON-LEGION2.
      2. Operator signs it with the lab certificate subject CN=RideAudit Lab Self-Signed and refuses unrelated store certificates.
      3. Operator records that signtool sees a signature and that verify /pa does not establish Public Trust.
      4. Operator leaves commercial signing (individual Payton Byrd: IV plus eSigner, or OV plus cloud HSM) and macOS codesign deferred.
      5. Operator does not treat the lab signature as AC-RIDE-222-001 or plan section 9.
    acceptanceCriteria:
      - id: AC-UC-034-001
        text: Lab win-x64 signing uses CN=RideAudit Lab Self-Signed, is not Public Trust, and does not close AC-RIDE-222-001 or plan section 9.
