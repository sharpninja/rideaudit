  - kind: fr
    id: FR-RIDE-073
    title: Android visual regression with SharpNinja.aiUnit
    description: >
      The RideAudit Android Avalonia client references SharpNinja.aiUnit and
      runs automated visual regression tests on a connected Android device.
      Each wireframe is a single-screen compare unless that wireframe says
      otherwise. Each storyboard is a step sequence: the test drives the
      running app through SharpNinja.Avalonia.RemoteControl (AvaloniaRemote)
      and compares a screenshot at each frame. Screenshot validation includes
      usability validation in addition to baseline comparison. The comparison
      threshold is documented. A mismatch fails closed. A usability defect
      fails closed even when pixels match the baseline. A static single-shot
      screenshot does not satisfy a storyboard.
    priority: high
    area: RIDE
    status: pending
    notes: >
      Operator add 2026-09-29, updated the same day for storyboard navigation
      and for usability checks in addition to pixel comparison.
      Android visual and usability tests use the SharpNinja.aiUnit codex-subscription profile.
      approval: Payton AGREE 2026-09-29. Does not close AC-UC-025-001.
      Baselines are the wireframe and storyboard documents under docs/ux, including docs/ux/review-app.
      Storyboard steps are the beats in those documents. Each beat is a frame.
      Storyboard driving uses SharpNinja.Avalonia.RemoteControl, required by FR-RIDE-067.
      ADB taps are not the storyboard step driver.
      Current client project is src/RideAudit.Client.Android/RideAudit.Client.Android.csproj.
      An emulator-only run does not satisfy device-connected execution.
      Package version is not invented here.
