        isSatisfied: false
      - id: AC-UC-043-008
        text: A pixel match alone does not satisfy the use case when a usability defect is present.
        isSatisfied: false
      - id: AC-UC-043-009
        text: The operator configures SharpNinja.aiUnit to the codex-subscription profile before the Android visual and usability run. Another profile fails this use case.
        isSatisfied: false
