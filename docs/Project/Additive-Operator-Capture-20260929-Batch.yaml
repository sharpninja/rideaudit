      client on PAYTON-LEGION2 against a connected Android device. Each wireframe
      is a single-screen compare. Each storyboard is driven step by step through
      SharpNinja.Avalonia.RemoteControl (AvaloniaRemote), with a screenshot compared
      at each frame. The same screenshots are checked for usability defects.
