records:
  - kind: fr
    id: FR-RIDE-056
    title: Avalonia UI 12 Android dual-phone capture client
    description: Implement the Android dual-phone capture client (driver coordinator and passenger compositor) with Avalonia UI 12 as the sole UI framework for capture surfaces.
    priority: high
    area: RIDE
    status: pending
    notes: >
      Stack decision. Cross-link docs/architecture/stack.md and ART-RIDE-ANDROID-001. Author Sharp Ninja.
      Update 2026-09-29: primary device proof for AC-UC-025 class runtime is a Samsung Galaxy Z Fold 4 on USB.
      Emulator-only evidence does not satisfy that class. approval: pending Payton AGREE.
      Does not mark AC-UC-025-001 satisfied. Does not close plan section 9.
    acceptanceCriteria:
      - id: AC-RIDE-056-001
        text: Android capture client builds and runs with Avalonia UI 12 for driver and passenger roles.
        isSatisfied: false
      - id: AC-RIDE-056-002
        text: Capture UX does not depend on a non-Avalonia UI framework for primary screens.
        isSatisfied: false
      - id: AC-RIDE-056-003
        text: Primary device proof for AC-UC-025 class runtime is a Samsung Galaxy Z Fold 4 attached by USB. Emulator-only runs do not satisfy that runtime class. A lab shell receipt is not semantic closure of AC-UC-025-001.
        isSatisfied: false
