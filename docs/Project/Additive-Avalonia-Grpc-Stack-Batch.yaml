    title: Shared Avalonia UI 12 constraints under GPL-2.0
    description: Share Avalonia UI 12 controls, themes, and client libraries across Android capture and desktop review under GPL-2.0. Do not introduce a conflicting UI license for in-scope RideAudit application UI code.
