        isSatisfied: false
  - kind: fr
    id: FR-RIDE-059
    title: Backend gRPC on .NET 10 containers
    description: Expose the public RideAudit backend as gRPC services hosted on .NET 10 and deployed as containers. Accept only sealed ciphertext packages plus custody-receipt metadata at ingest. Never decrypt sealed payloads at public-server ingest.
    priority: critical
    area: RIDE
    status: pending
    notes: Stack decision. Extends FR-RIDE-035. Cross-link docs/architecture/stack.md and ART-RIDE-API-001. Author Sharp Ninja.
    acceptanceCriteria:
      - id: AC-RIDE-059-001
        text: Public backend services are gRPC on .NET 10 and ship as container images.
        isSatisfied: false
      - id: AC-RIDE-059-002
        text: Ingest accepts only sealed ciphertext plus custody-receipt metadata and never decrypts at ingest.
        isSatisfied: false
  - kind: fr
    id: FR-RIDE-060
    title: Proto and schema publication under GPL-2.0
    description: Publish authoritative gRPC protobuf contracts and related custody or verification schemas under GPL-2.0 with versioned source and license notices so clients and forks can interoperate without inventing private Lyft APIs.
    priority: high
    area: RIDE
    status: pending
    notes: Stack decision. Aligns with FR-RIDE-029. Author Sharp Ninja.
    acceptanceCriteria:
      - id: AC-RIDE-060-001
        text: Proto files and related schemas are published under GPL-2.0 with version and license notices.
        isSatisfied: false
      - id: AC-RIDE-060-002
        text: Published contracts do not invent undocumented Lyft private APIs.
        isSatisfied: false
  - kind: fr
    id: FR-RIDE-061
    title: Fail-closed admission over gRPC
    description: Apply existing fail-closed admission verification (receipt, hash, chain, attestation, binding, authorized driver or vehicle) to all gRPC submit and admission RPCs. Reject and do not store on any verification failure.
    priority: critical
    area: RIDE
    status: pending
    notes: Stack decision. Extends FR-RIDE-036 over the gRPC transport. Author Sharp Ninja.
    acceptanceCriteria:
      - id: AC-RIDE-061-001
        text: gRPC submit and admission RPCs run the same fail-closed admission checks as FR-RIDE-036.
        isSatisfied: false
      - id: AC-RIDE-061-002
        text: Any admission failure rejects the RPC without storing an admitted sealed package.
        isSatisfied: false
  - kind: fr
    id: FR-RIDE-062
    title: Interim OpenAPI companion non-authoritative
    description: Treat any interim OpenAPI description as a non-authoritative human-readable companion. gRPC protobuf contracts are the sole authoritative service API for clients and admission behavior.
    priority: high
    area: RIDE
    status: pending
    notes: Stack decision. ART-RIDE-API-001 may retain OpenAPI as companion only. Author Sharp Ninja.
    acceptanceCriteria:
      - id: AC-RIDE-062-001
        text: Documentation and ARTIFACT metadata state that OpenAPI is non-authoritative versus gRPC protos.
        isSatisfied: false
      - id: AC-RIDE-062-002
        text: Client and server conformance tests bind to gRPC contracts, not OpenAPI, when they disagree.
        isSatisfied: false
