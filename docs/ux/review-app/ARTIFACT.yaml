notes: >
  Avalonia UI 12 desktop court/counsel review app UX (Windows, Linux, macOS).
  Fail-closed independent verification (Bitcoin OTS primary, hashes, Play Integrity,
  escrow auth) before any decrypt or display. Decrypt only via court-authorized
  M-of-N escrow into an expiring working copy. Produces ViewerSession and
  VerificationReport per review. Multi-driver bundles verify per-record, not merged
  custody. Backend services are gRPC on .NET 10 containers. No Lyft private APIs;
  Unverified gaps labeled. Does not replace ART-RIDE-UX-001 (mobile capture UX).
