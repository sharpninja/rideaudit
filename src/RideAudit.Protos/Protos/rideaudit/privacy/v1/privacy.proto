// FR-RIDE-010, FR-RIDE-077, FR-RIDE-207. (FR-014 RBAC / FR-210 legal-hold killed; PlaceLegalHold RPC removed.)
// DSAR export does not include sealed plaintext.
syntax = "proto3";

package rideaudit.privacy.v1;

option csharp_namespace = "RideAudit.Protos.Privacy.V1";

service Privacy {
  // reserved: former PlaceLegalHold RPC and LegalHoldRequest/Response messages removed with FR-210.
  rpc RequestAccessExport (AccessExportRequest) returns (AccessExportResponse);
  rpc RequestDeletion (DeletionRequest) returns (DeletionResponse);
  rpc ViewLocations (ViewLocationsRequest) returns (ViewLocationsResponse);
}

message AccessExportRequest {
  string subject_driver_id = 1;
}

message AccessExportResponse {
  string export_id = 1;
  string status = 2;
  bytes zip_bytes = 3;
}

message DeletionRequest {
  string subject_driver_id = 1;
  string case_id = 2;
}

message DeletionResponse {
  string status = 1;
  bool deleted = 2;
  bool custody_ciphertext_retained = 3;
}

message ViewLocationsRequest {
  string driver_id = 1;
}

message LocationSample {
  string sample_id = 1;
  string latitude = 2;
  string longitude = 3;
  bool precise = 4;
}

message ViewLocationsResponse {
  repeated LocationSample samples = 1;
}

