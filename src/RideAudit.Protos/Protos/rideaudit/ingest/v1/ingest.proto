syntax = "proto3";

package rideaudit.ingest.v1;

option csharp_namespace = "RideAudit.Protos.Ingest.V1";

service Ingest {
  rpc IngestPrivacyExport (IngestPrivacyExportRequest) returns (IngestPrivacyExportResponse);
}

message IngestPrivacyExportRequest {
  bytes zip_bytes = 1;
  string provenance_tag = 2;
  string source_label = 3;
}

message IngestPrivacyExportResponse {
  string import_id = 1;
  string status = 2;
}
