// Contract-Version: 0.3.0
//
// Public ingest accepts sealed ciphertext plus custody metadata only.
// These RPCs must not decrypt. FR-RIDE-035, FR-RIDE-036, FR-RIDE-059, FR-RIDE-061.
syntax = "proto3";

package rideaudit.admission.v1;

import "rideaudit/custody/v1/receipt.proto";

option csharp_namespace = "RideAudit.Protos.Admission.V1";

service Admission {
  rpc OpenSession (OpenSessionRequest) returns (AuditSession);
  rpc SubmitSealed (SubmitSealedRequest) returns (AdmissionDecision);
  rpc UploadSealedChunk (UploadSealedChunkRequest) returns (UploadSealedChunkResponse);
  rpc GetAdmissionStatus (GetAdmissionStatusRequest) returns (AdmissionDecision);
  rpc Health (HealthRequest) returns (HealthResponse);
}

message OpenSessionRequest {
  string vehicle_id = 1;
  bool dual_phone = 2;
}

message AuditSession {
  string session_id = 1;
  string driver_id = 2;
  string tenant_id = 3;
  string vehicle_id = 4;
  string status = 5;
  int64 created_unix_millis = 6;
  bool dual_phone = 7;
}

message AttestationSubmission {
  string provider = 1;
  string token = 2;
  string nonce = 3;
  int64 obtained_unix_millis = 4;
  string package_name = 5;
  string cert_digest = 6;
  string bound_key_id = 7;
  string bound_session_id = 8;
}

message SubmitSealedRequest {
  string session_id = 1;
  string vehicle_id = 2;
  string idempotency_key = 3;
  string content_type = 4;
  bytes sealed_envelope = 5;
  rideaudit.custody.v1.ReceiptCore receipt_core = 6;
  AttestationSubmission attestation = 7;
}

message AdmissionDecision {
  string submission_id = 1;
  string custody_state = 2;
  bool admitted = 3;
  bool collection_complete = 4;
  string reject_code = 5;
  string message = 6;
  repeated string checks = 7;
  bool ciphertext_stored = 8;
  bytes receipt_core_digest = 9;
  rideaudit.custody.v1.AnchorProofEnvelope anchor = 10;
}

message UploadSealedChunkRequest {
  string session_id = 1;
  string vehicle_id = 2;
  string idempotency_key = 3;
  string upload_id = 4;
  int32 chunk_index = 5;
  int32 total_chunks = 6;
  bytes sealed_chunk = 7;
  bytes chunk_content_hash = 8;
  string content_type = 9;
  rideaudit.custody.v1.ReceiptCore receipt_core = 10;
  AttestationSubmission attestation = 11;
}

message UploadSealedChunkResponse {
  bool complete = 1;
  AdmissionDecision decision = 2;
  string reject_code = 3;
}

message GetAdmissionStatusRequest {
  string submission_id = 1;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string contract_authority = 2;
  string openapi_role = 3;
  string framework = 4;
  string contract_version = 5;
  string service = 6;
}
