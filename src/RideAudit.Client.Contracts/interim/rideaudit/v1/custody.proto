// INTERIM client contract generated locally because src/RideAudit.Protos is not on master.
// The OpenAPI companion under artifacts/server-api is non-authoritative.
// Swap this file for the shared proto (same package and field numbers) without rewriting UI.

syntax = "proto3";

package rideaudit.v1;

option csharp_namespace = "RideAudit.V1";

message CustodyReceipt {
  string session_id = 1;
  string sealed_record_id = 2;
  string content_hash = 3;
  string plaintext_content_hash = 4;
  string sealed_at = 5;
  string attestation_token_hash = 6;
  string key_scheme = 7;
  bool composite = 8;
  repeated string device_ids = 9;
  string blockchain_tx_hint = 10;
  string chain_id = 11;
  string package_identity = 12;
  string signing_cert_digest = 13;
  string attestation_reference = 14;
  string key_id = 15;
  string public_key_pem = 16;
  string collector_identity = 17;
  string provenance_tag = 18;
  string algorithm = 19;
  string algorithm_version = 20;
  string key_scope = 21;
  string scope_id = 22;
  string key_binding_digest = 23;
  string nonce = 24;
  string admission_policy_id = 25;
  string chain_write_status = 26;
  string attestation_provider = 27;
  string license_id = 28;
  string source_commit_notice = 29;
  string codec = 30;
  string compression = 31;
  string overlay_manifest_version = 32;
  string sync_clock_offset = 33;
  int32 dropped_frame_count = 34;
  repeated string source_stream_ids = 35;
  string linked_composite_id = 36;
  string stub_notice = 37;
}

message AppAttestation {
  string provider = 1;
  string token_hash = 2;
  string nonce = 3;
  string obtained_at = 4;
  bool client_claimed_verdict_ok = 5;
  string package_identity = 6;
  string signing_cert_digest = 7;
  string verdict = 8;
  string stub_notice = 9;
}

message SubmitSealedRequest {
  string session_id = 1;
  string vehicle_id = 2;
  CustodyReceipt receipt = 3;
  AppAttestation attestation = 4;
  string sealed_blob_ref = 5;
  string content_type = 6;
  bytes ciphertext = 7;
  string submitter_role = 8;
}

message SubmitSealedResponse {
  string submission_id = 1;
  string status = 2;
  string error_code = 3;
  string message = 4;
}

message AdmissionStatusRequest {
  string submission_id = 1;
}

message AdmissionStatusResponse {
  string submission_id = 1;
  string decision = 2;
  bool receipt_present = 3;
  bool play_integrity_ok = 4;
  bool vehicle_registered = 5;
  bool plaintext_rejected = 6;
  string reject_code = 7;
}

service SealedAdmission {
  rpc SubmitSealed (SubmitSealedRequest) returns (SubmitSealedResponse);
  rpc GetAdmissionStatus (AdmissionStatusRequest) returns (AdmissionStatusResponse);
}
