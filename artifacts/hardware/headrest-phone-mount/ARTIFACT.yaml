notes: >
  Clamps to two vertical headrest posts and holds one or two landscape phones.
  Default layout is opposed (road + cabin). Dual-forward uses the beam extensions.
  Geometry is verified by verify-geometry.py. Not crash-rated. Not an on-vehicle
  release until the operator checklist in verification/vehicle-fit-checklist.md
  is completed. Supports RideAudit dual-phone capture; it does not implement
  the capture software.
