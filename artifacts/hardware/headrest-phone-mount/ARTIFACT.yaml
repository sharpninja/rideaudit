physicalRelease: not-claimed
notes: >
  Two post blocks, one per headrest post. The post passes through the block
  and the heel is flush on the pad. Each block has a horizontal 200 mm arm.
  Both arms slide into one shared vertical cradle from the rear. Each arm has
  a longitudinal slot so the cradle depth can slide before it locks. One
  modeled M8×1.25 thumbscrew per arm, with an external thread on the shank,
  comes up from below, through a clearance slot in the cradle bottom, through
  that arm slot, and into the tap-drill hole row in the receiver roof. Fully
  seated, the head clamps an 18 mm stack (6 mm bottom plate + 12 mm arm) and
  leaves 12 mm of thread in the roof. Arms are 56 × 12 mm so the rails beside
  the slot stay stiff. The phone sits flush on the vertical plate.
  Geometry is verified by verify-geometry.py. Not crash-rated. Not an on-vehicle
  release until the operator checklist in verification/vehicle-fit-checklist.md
  is completed. Supports RideAudit phone capture; it does not implement
  the capture software.
