notes: >
  Two post blocks, one per headrest post. The post passes through the block
  and the rear of the collar is tangent to the pad. The collar is one
  cylinder, outside 25.5 mm and 33 mm thick along the post. The bore is
  post_od plus 0.2-0.5 mm clearance. The default is a 14 mm post, so the
  preview bore is 14.5 mm. Spacing in the CAD range is 120-170 mm; the
  preview is 150 mm. Each block has a horizontal 200 mm arm. The arm shares
  the collar bottom, and short blends rise into the 33 mm collar so the
  moment enters the tube around the post. Both arms slide into one shared
  vertical cradle from the rear. Each arm has a longitudinal slot 1 mm clear
  of the M8 crest on each side, so the cradle depth can slide before it locks.
  One modeled M8×1.25 thumbscrew per arm, with an external thread on the shank,
  comes up from below on the arm centerline, through a clearance slot in the
  cradle bottom, through that arm slot, and into the roof. Fully seated, the
  head clamps an 18 mm stack (6 mm bottom plate + 12 mm arm) and leaves 12 mm
  of thread in the roof. Arms are 56 × 12 mm. The phone sits flush on the
  vertical plate.
  Geometry is verified by tools/RideAudit.HeadrestGeometry (dotnet run --project). Not crash-rated. Not an on-vehicle
  release until the operator checklist in verification/vehicle-fit-checklist.md
  is completed. Supports RideAudit phone capture; it does not implement
  the capture software.
  Lab conduct receipts for toolchain changes live under docs/receipts/remediation/.
