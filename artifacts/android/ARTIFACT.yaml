notes: >
  Target UI stack is Avalonia UI 12 for Android, shared with the desktop app.
  The Kotlin and Gradle files in this directory are historical and superseded
  placeholders, not the target implementation. Minimal project skeleton only.
  Play Store publishing is not claimed as complete. Dual-phone model: Bluetooth
  discovery creates a driver-rider pairing. Driver phone coordinates session
  clock, admit/start/stop, seal admission, and submission. Passenger phone
  handles video sync, stream compositing, and realtime telematics
  (spider-graph overlay). No Lyft private APIs.
