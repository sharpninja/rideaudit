  - FR-RIDE-030  # GPL2 notices on artifacts
spec: openapi.yaml  # Non-authoritative human-readable companion only
notes: >
  Authoritative wire contracts are src/RideAudit.Protos/ (FR-RIDE-060).
  openapi.yaml is a non-authoritative companion (FR-RIDE-062). When they
  disagree, grpc-protobuf wins. Public sealed-submission API only.
  Fail-closed admission. No decrypt at ingest. Bearer driver-account token
  is a placeholder scheme in the interim OpenAPI document. Admission runtime
  in this tree is in-process plus deploy/containers/admission; it is not a
  claim of production custody against live Bitcoin.
