id: ART-RIDE-API-001
kind: grpc-api
version: "0.3.0"
title: RideAudit public sealed-submission API
author: Sharp Ninja
license: GPL-2.0-only
path: artifacts/server-api/
status: contract-ready-admission-runtime
targetStack: gRPC on .NET 10 containers
authoritativeContract: src/RideAudit.Protos/
authoritativeContractFormat: proto3
contractVersion: "0.3.0"
companionAuthority: non-authoritative
interimHumanReadableCompanion: openapi.yaml
implementationStatus: >
  S1 protos are authoritative. S2 admission and identity gRPC run in-process
  with a container sketch. S3 btc-ots uses a documented fixture calendar, not
  live Bitcoin. S4 escrow is an in-process HSM boundary. S5-S9 are scaffolded
  and not runtime-validated. OpenAPI remains a non-authoritative companion.
relatedFrIds:
  - FR-RIDE-032  # Public-server driver account
  - FR-RIDE-033  # Vehicle registration
  - FR-RIDE-035  # Sealed-only submission API
