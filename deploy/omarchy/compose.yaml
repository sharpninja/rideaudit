# RideAudit admission (counsel RPCs on the same host).
# Bind loopback only. Does not replace Octopus/SQL/Caddy on PAYTON-OMARCHY.
# Production cutover MUST use this file with --no-build --pull never so compose
# cannot silently rebuild a different local artifact. Rebuilds use
# compose.build.yaml, then the recorded digest in RECORDED-IMAGE-DIGEST must
# be updated. Not a CD green. Not GHCR.

name: rideaudit-omarchy

services:
  admission:
    image: rideaudit-admission:local@sha256:031a4a6e21cc0424a6276a59b9d38cabe15f7c5670468d3a99e4dcb8aad9fee5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      RIDEAUDIT_EDGE_TLS: "true"
      RIDEAUDIT_OTS_CALENDAR: ${RIDEAUDIT_OTS_CALENDAR:-}
      RIDEAUDIT_L2_CALENDAR: ${RIDEAUDIT_L2_CALENDAR:-}
      RIDEAUDIT_L2_RPC: ${RIDEAUDIT_L2_RPC:-}
      RIDEAUDIT_PLAY_INTEGRITY: ${RIDEAUDIT_PLAY_INTEGRITY:-}
      RIDEAUDIT_TLS_CERT_PATH: ${RIDEAUDIT_TLS_CERT_PATH:-}
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped

  counsel:
    image: rideaudit-counsel:local@sha256:031a4a6e21cc0424a6276a59b9d38cabe15f7c5670468d3a99e4dcb8aad9fee5
    profiles: ["counsel-split"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      RIDEAUDIT_EDGE_TLS: "true"
      RIDEAUDIT_SERVICE_ROLE: counsel
      RIDEAUDIT_OTS_CALENDAR: ${RIDEAUDIT_OTS_CALENDAR:-}
      RIDEAUDIT_L2_CALENDAR: ${RIDEAUDIT_L2_CALENDAR:-}
      RIDEAUDIT_L2_RPC: ${RIDEAUDIT_L2_RPC:-}
      RIDEAUDIT_PLAY_INTEGRITY: ${RIDEAUDIT_PLAY_INTEGRITY:-}
    ports:
      - "127.0.0.1:18081:8080"
    restart: unless-stopped
